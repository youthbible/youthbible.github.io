<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오늘의 해부학 질문 | 로그인</title>
    <meta name="robots" content="noindex">
    <script src="https://accounts.google.com/gsi/client" async></script>
    <style>
      body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; background: #f5f3ef; margin: 0; padding: 16px; color: #2b2622; font-size: 16px; }
      .card { max-width: 420px; margin: 40px auto; background: #fff; border-radius: 12px; padding: 32px 24px; border-top: 6px solid #8a5a44; text-align: center; }
      h1 { font-size: 20px; color: #8a5a44; margin: 0 0 12px; }
      p { margin: 0 0 20px; }
      .muted { color: #6b625b; font-size: 14px; }
      .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; width: 100%; background: #8a5a44;
             color: #fff; text-decoration: none; border-radius: 8px; font-size: 17px; border: 0; font-family: inherit; }
      .btn.line { background: #fff; color: #8a5a44; border: 1px solid #8a5a44; margin-top: 8px; }
      #gbtn { display: flex; justify-content: center; min-height: 44px; }
      .hidden { display: none !important; }
      ol { text-align: left; padding-left: 20px; }
      .err { color: #c62828; }
      .spinner { width: 40px; height: 40px; border: 4px solid #eadfd8; border-top-color: #8a5a44; border-radius: 50%;
                 animation: spin 1s linear infinite; margin: 8px auto 14px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #moving b { display: block; font-size: 17px; margin-bottom: 6px; }
    </style>
  </head>
  <body>
    <div class="card" id="login">
      <h1>오늘의 해부학 질문</h1>
      <p class="muted" id="intro">등록된 Google 계정으로 로그인해 주세요.<br>이메일 주소 확인에만 사용해요.</p>
      <div id="gbtn"></div>
      <div class="hidden" id="moving">
        <div class="spinner"></div>
        <b>학습 화면으로 이동하고 있어요</b>
        <button class="btn line hidden" id="retryBtn" onclick="retry()">화면이 안 바뀌면 다시 시도</button>
      </div>
      <p class="err hidden" id="error" style="margin-top:20px"></p>
      <button class="btn line hidden" id="otherBtn" onclick="other()">다른 계정으로 로그인</button>
    </div>

    <div class="card hidden" id="inapp">
      <p><b>앱 안의 브라우저에서는 Google 로그인이 막힐 수 있어요.</b></p>
      <p class="muted">Chrome, Safari 같은 기본 브라우저에서 열어 주세요.</p>
      <a class="btn hidden" id="kakaoOpen">기본 브라우저로 열기</a>
      <ol class="muted hidden" id="iosGuide">
        <li>화면의 <b>⋯</b> 또는 <b>공유</b> 버튼을 누릅니다.</li>
        <li><b>Safari로 열기</b> 또는 <b>다른 브라우저로 열기</b>를 고릅니다.</li>
      </ol>
      <button class="btn line" onclick="showLogin()">그래도 여기서 계속하기</button>
    </div>

    <script>
      // Google Cloud > Google 인증 플랫폼 > 클라이언트 (웹 애플리케이션, 원본 https://youthbible.github.io)
      const CLIENT_ID = 'REPLACE_WITH_CLIENT_ID.apps.googleusercontent.com';
      // 해부학 커리큘럼 GAS 웹앱 (저장소 odaka-anatomy-coach deploy/deployment.json)
      const APP_URL = 'https://script.google.com/macros/s/AKfycbxycUPwtALccN7tWlhD0uFl8x3Scttw7xRQW8x7uAVUNb4fKVdcN_fz_xuJB3om7bTf5w/exec';

      // 로그인 유지: 웹앱이 준 세션 토큰(30일)을 이 브라우저에 두고 다음부터 바로 이동
      // forget=1: 계정 바꾸기 또는 웹앱이 세션을 거절했을 때 → 지우고 Google 로그인부터
      const KEEP_KEY = 'anatomy_keep_login';
      const params = new URLSearchParams(location.search);
      const forget = params.get('forget') === '1';
      function readKeep() { try { return JSON.parse(localStorage.getItem(KEEP_KEY) || 'null'); } catch (e) { return null; } }
      function writeKeep(v) { try { if (v) localStorage.setItem(KEEP_KEY, JSON.stringify(v)); else localStorage.removeItem(KEEP_KEY); } catch (e) {} }
      function appUrl(st) { return APP_URL + '?st=' + encodeURIComponent(st); }
      if (forget) writeKeep(null);

      let moving = false;
      function show(id, on) { document.getElementById(id).classList.toggle('hidden', !on); }
      function go(url) {
        moving = true;
        ['gbtn', 'intro', 'error', 'otherBtn'].forEach(function (id) { show(id, false); });
        show('moving', true);
        try { if (window.google && google.accounts) google.accounts.id.cancel(); } catch (e) {}
        setTimeout(function () { show('retryBtn', true); }, 15000);
        if (url) location.replace(url);
      }
      function fail(msg) {
        moving = false;
        show('moving', false); show('gbtn', true); show('intro', true);
        const e = document.getElementById('error'); e.textContent = msg; show('error', true);
        show('otherBtn', true);
      }
      function retry() { document.getElementById('retryBtn').disabled = true; location.reload(); }
      function other() { location.replace(location.pathname + '?forget=1'); }
      window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });

      const keep = !forget ? readKeep() : null;
      const keepOk = Boolean(keep && keep.token && keep.exp > Date.now() + 60 * 1000);
      if (keepOk) go(appUrl(keep.token));

      const ua = navigator.userAgent || '';
      const inApp = /KAKAOTALK|Instagram|FBAN|FBAV|Line\/|NAVER\(inapp|DaumApps|everytimeApp|BAND\//i.test(ua);
      if (inApp && !keepOk) {
        show('login', false); show('inapp', true);
        if (/KAKAOTALK/i.test(ua) && /Android/i.test(ua)) {
          const a = document.getElementById('kakaoOpen');
          a.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
          show('kakaoOpen', true);
        } else {
          show('iosGuide', true);
        }
      }
      function showLogin() { show('inapp', false); show('login', true); }

      function onCredential(res) {
        if (moving) return;
        go('');
        fetch(APP_URL + '?api=login&idt=' + encodeURIComponent(res.credential))
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d.ok || !d.token) return fail(d.message || '로그인에 실패했어요. 다시 시도해 주세요.');
            writeKeep({ token: d.token, exp: d.exp });
            location.replace(appUrl(d.token));
          })
          .catch(function () { fail('연결에 실패했어요. 잠시 후 다시 시도해 주세요.'); });
      }

      window.onload = function () {
        if (keepOk) return;
        if (!window.google || !google.accounts) return fail('Google 로그인을 불러오지 못했어요. 새로고침해 주세요.');
        google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, ux_mode: 'popup', auto_select: !forget });
        google.accounts.id.renderButton(document.getElementById('gbtn'),
          { theme: 'outline', size: 'large', text: 'continue_with', shape: 'pill', locale: 'ko', width: 280 });
        if (!inApp) google.accounts.id.prompt();
      };
    </script>
  </body>
</html>
