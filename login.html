<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | 가톨릭청년성서모임 대관 신청</title>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <style>
      body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; background: #f3f8f2; margin: 0; padding: 16px; color: #1f2d1f; font-size: 16px; }
      .card { max-width: 420px; margin: 40px auto; background: #fff; border-radius: 12px; padding: 32px 24px; border-top: 6px solid #2e7d32; text-align: center; }
      h1 { font-size: 20px; color: #2e7d32; margin: 0 0 12px; }
      p { margin: 0 0 20px; }
      .muted { color: #5b6b5b; font-size: 14px; }
      .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; width: 100%; background: #2e7d32;
             color: #fff; text-decoration: none; border-radius: 8px; font-size: 17px; border: 0; font-family: inherit; }
      .btn.line { background: #fff; color: #2e7d32; border: 1px solid #2e7d32; margin-top: 8px; }
      #gbtn { display: flex; justify-content: center; min-height: 44px; }
      .hidden { display: none !important; }  /* #gbtn { display:flex }보다 우선해야 로그인 버튼이 실제로 숨는다 */
      ol { text-align: left; padding-left: 20px; }
      .err { color: #c62828; }
      /* 이동 중 화면: 로그인 버튼 대신 보인다 (다시 누를 수 없게) */
      .spinner { width: 40px; height: 40px; border: 4px solid #c8e6c9; border-top-color: #2e7d32; border-radius: 50%;
                 animation: spin 1s linear infinite; margin: 8px auto 14px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #moving b { display: block; font-size: 17px; color: #1b5e20; margin-bottom: 6px; }
    </style>
  </head>
  <body>
    <div class="card" id="login">
      <h1 id="title">로그인</h1>
      <p class="muted" id="intro">신청자 확인을 위해 Google 계정으로 로그인해 주세요.</p>
      <div id="gbtn"></div>
      <div class="hidden" id="moving">
        <div class="spinner"></div>
        <b>신청 화면으로 이동하고 있습니다</b>
        <button class="btn line hidden" id="retryBtn" onclick="retry()">화면이 안 바뀌면 다시 시도</button>
      </div>
      <p class="err hidden" id="error" style="margin-top:20px"></p>
    </div>

    <div class="card hidden" id="inapp">
      <p><b>앱 안의 브라우저에서는 구글 로그인이 막힐 수 있습니다.</b></p>
      <p class="muted">Chrome, Safari 같은 기본 브라우저에서 열어 주세요.</p>
      <a class="btn hidden" id="kakaoOpen">기본 브라우저로 열기</a>
      <ol class="muted hidden" id="iosGuide">
        <li>화면 오른쪽 아래(또는 위)의 <b>⋯</b> 또는 <b>공유</b> 버튼을 누릅니다.</li>
        <li><b>Safari로 열기</b> 또는 <b>다른 브라우저로 열기</b>를 고릅니다.</li>
      </ol>
      <button class="btn line" onclick="showLogin()">그래도 여기서 계속하기</button>
    </div>

    <script>
      // Google Cloud > 사용자 인증 정보 > OAuth 클라이언트 ID(웹 애플리케이션)
      const CLIENT_ID = '690027322672-cvea11op9483oamucai77656uf9hlllq.apps.googleusercontent.com';
      // 예약시스템 웹앱 (…-varA 배포)
      const MAIN_APP_URL = 'https://script.google.com/macros/s/AKfycbyiACYNNv3813hpDWnUH77MuwaQTmP12I6cfkzWPyDmsEaqHxFAU4Avh6ui4BpJd-varA/exec';
      const PAGES = {
        dept: '센터부서 & 연수봉사 대관 신청',
        study: '센터 그룹공부 대관 신청',
        vehicle: '차량 출입 등록 신청',
        external: '외부 단체 예약 신청',
        admin: '관리자 페이지',
      };

      // 신청 첫 화면 (next가 없거나 틀린 주소면 여기로 보낸다)
      const SITE_URL = 'https://sites.google.com/view/youthbible-rsv/home';
      const params = new URLSearchParams(location.search);
      const next = Object.prototype.hasOwnProperty.call(PAGES, params.get('next')) ? params.get('next') : '';
      if (!next) location.replace(SITE_URL);
      // 관리자 화면에서 신청 한 건만 볼 때 (텔레그램 알림 링크). 신청ID 모양만 넘긴다.
      const rid = next === 'admin' && /^[DSVE]-\d{8}-\d{3}$/.test(params.get('rid') || '') ? params.get('rid') : '';
      document.getElementById('title').textContent = PAGES[next] || '';
      document.title = (PAGES[next] || '예약') + ' | 로그인';

      // 로그인 유지: 처음 Google 로그인 때 웹앱에서 받은 토큰(30일)을 이 브라우저에 두고, 다음부터는 바로 이동한다.
      // forget=1: 계정 바꾸기 또는 웹앱이 토큰을 거절했을 때 → 지우고 Google 로그인부터
      const KEEP_KEY = 'rsv_keep_login';
      const forget = params.get('forget') === '1';
      function readKeep() {
        try { return JSON.parse(localStorage.getItem(KEEP_KEY) || 'null'); } catch (e) { return null; }
      }
      function writeKeep(v) {
        try { if (v) localStorage.setItem(KEEP_KEY, JSON.stringify(v)); else localStorage.removeItem(KEEP_KEY); } catch (e) {}
      }
      function appUrl(extra) {
        return MAIN_APP_URL + '?page=' + next + (rid ? '&rid=' + rid : '') + extra;
      }
      if (forget) writeKeep(null);

      // 이동 중: 로그인 버튼을 바로 숨기고 로딩 표시. 로그인 버튼을 다시 누르면 두 번째 로그인 창이 열리고
      // 첫 이동이 끊겨 흰 화면만 남았다. 이 페이지는 방문 기록에 남기지 않는다(replace) → 뒤로 가기로 멈춘 화면에 오지 않음.
      // 오래(15초) 안 바뀌면 '다시 시도' 버튼. 로그인 유지 토큰을 이미 받았으면 Google 로그인 없이 바로 다시 이동한다.
      let moving = false;
      function go(url) {
        moving = true;
        ['gbtn', 'intro', 'error'].forEach(function (id) { document.getElementById(id).classList.add('hidden'); });
        document.getElementById('moving').classList.remove('hidden');
        try { if (window.google && google.accounts) google.accounts.id.cancel(); } catch (e) {}
        setTimeout(function () { document.getElementById('retryBtn').classList.remove('hidden'); }, 15000);
        if (url) location.replace(url);
      }
      function retry() {
        document.getElementById('retryBtn').disabled = true;
        location.reload();
      }
      // 뒤로·앞으로 가기로 예전 화면이 그대로 돌아오면(bfcache) 새로 연다.
      window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });

      const keep = next && !forget ? readKeep() : null;
      const keepOk = Boolean(keep && keep.token && keep.exp > Date.now() + 60 * 1000);
      if (keepOk) go(appUrl('&st=' + encodeURIComponent(keep.token)));

      const ua = navigator.userAgent || '';
      const inApp = /KAKAOTALK|Instagram|FBAN|FBAV|Line\/|NAVER\(inapp|DaumApps|everytimeApp|BAND\//i.test(ua);
      if (inApp && !keepOk) {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('inapp').classList.remove('hidden');
        if (/KAKAOTALK/i.test(ua) && /Android/i.test(ua)) {
          const a = document.getElementById('kakaoOpen');
          a.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
          a.classList.remove('hidden');
        } else {
          document.getElementById('iosGuide').classList.remove('hidden');
        }
      }

      function showLogin() {
        document.getElementById('inapp').classList.add('hidden');
        document.getElementById('login').classList.remove('hidden');
      }

      function onCredential(res) {
        if (moving) return;  // 이미 이동 중이면 두 번째 로그인은 무시
        go('');
        const idt = encodeURIComponent(res.credential);
        // 로그인 유지 토큰을 받아 저장한 뒤 이동. 못 받으면(네트워크 등) 예전처럼 이번 한 번만 로그인해서 이동한다.
        fetch(MAIN_APP_URL + '?api=login&idt=' + idt)
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d.ok || !d.token) throw new Error(d.message || 'no token');
            writeKeep({ token: d.token, exp: d.exp });
            location.replace(appUrl('&st=' + encodeURIComponent(d.token)));
          })
          .catch(function () { location.replace(appUrl('&idt=' + idt)); });
      }

      window.onload = function () {
        if (!next || keepOk) return;
        if (!window.google || !google.accounts) {
          const e = document.getElementById('error');
          e.textContent = 'Google 로그인을 불러오지 못했습니다. 새로고침해 주세요.';
          e.classList.remove('hidden');
          return;
        }
        // auto_select: 전에 로그인한 계정이 하나뿐이면 버튼을 누르지 않아도 자동 로그인 (계정 바꾸기 때는 끔)
        google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, ux_mode: 'popup', auto_select: !forget });
        google.accounts.id.renderButton(document.getElementById('gbtn'),
          { theme: 'outline', size: 'large', text: 'continue_with', shape: 'pill', locale: 'ko', width: 280 });
        if (!inApp) google.accounts.id.prompt();
      };

    </script>
  </body>
</html>
